# yaml-language-server: $schema=../src/DataSchemas/ucl_open_coen_behaviour_box.json#/$defs/UclOpenCoenBehaviourBoxRig
# Rig configuration. On a rig this file is <ConfigRoot>\<MACHINE-NAME>\rig.yml, copied from
# config/rig-template.yml by scripts/deploy.ps1: fill in every CHANGE-ME value there, and anything
# else that differs on this rig. Per-rig values are never committed. To change the template
# itself, edit examples/rig.py and run it again rather than editing config/rig-template.yml.
# The frame rate is behaviorBoard.cameraTriggerController.trigger0Frequency; camera.triggerFrequency
# and trigger1Frequency are not used by this rig.
behaviorBoard:
  cameraTriggerController:
    trigger0Frequency: 50
    trigger1Frequency: 50
  portName: COM-CHANGE-ME
  pulseController: null
  runningWheel:
    countsPerRev: 4096
    wheelDiameterMm: 150.0
camera:
  binning: 1
  discriminatorType: SpinnakerCamera
  exposureTime: 10000.0
  gain: 5.0
  serialNumber: CHANGE-ME
  triggerFrequency: 50.0
rootPath: C:\Data\CHANGE-ME
version: 0.0.0-rc1
